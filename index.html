<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Presupuestador Advance ERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: editor de carga a la izquierda, mesa de trabajo con las hojas reales a la derecha. */
:root{
  --bg:#F6F2F5; --panel:#FFFFFF; --fg:#1D1622; --muted:#6E6474; --line:#E7DFE5; --field:#FBF8FA;
  --accent:#D91F6A; --accent2:#EC7533; --desk:#E9E2E7; --ok:#1F8A5B; --warn:#B4541A;
  --display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  /* papel: siempre claro, es lo que recibe el cliente */
  --d-ink:#1C1424; --d-soft:#5B5263; --d-faint:#968C9C; --d-line:#ECE4EA; --d-mist:#F8F3F6;
  --d-mag:#E2246F; --d-org:#F07B37; --d-plum:#1E1329; --d-paper:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141015; --panel:#1D171F; --fg:#F2EDF1; --muted:#A99FAD; --line:#332A35; --field:#231C25;
  --accent:#FF4F91; --accent2:#FF9152; --desk:#0E0B0F; --ok:#4CC38A; --warn:#F0A060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141015; --panel:#1D171F; --fg:#F2EDF1; --muted:#A99FAD; --line:#332A35; --field:#231C25;
  --accent:#FF4F91; --accent2:#FF9152; --desk:#0E0B0F; --ok:#4CC38A; --warn:#F0A060; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{width:30px;height:auto}
.brand b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:linear-gradient(120deg,var(--accent2),var(--accent));border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--accent)}

/* ---------- área principal ---------- */
.main{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);height:calc(100% - 58px)}
.ed{overflow:auto;border-right:1px solid var(--line);background:var(--panel);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:18px;padding-block:16px 60px;display:flex;flex-direction:column;gap:12px}
.desk{overflow:auto;background:var(--desk);padding-block:24px 60px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:900px){
  html,body{height:auto}
  .main{grid-template-columns:minmax(0,1fr);height:auto}
  .ed{border-right:0;padding-right:max(16px,env(safe-area-inset-right,0px));overflow:visible}
  .desk{overflow:visible}
  .tabs{display:flex!important}
  .main[data-view="ed"] .desk{display:none}
  .main[data-view="pv"] .ed{display:none}
}
.tabs{display:none;gap:6px;width:100%}
.tabs button{flex:1}
.tabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

/* resumen */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum div{background:var(--field);padding:10px 12px;min-width:0}
.sum span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sum b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;font-weight:600}
.sum .big{grid-column:1/-1;background:linear-gradient(120deg,color-mix(in srgb,var(--accent2) 14%,var(--field)),color-mix(in srgb,var(--accent) 14%,var(--field)))}
.sum .big b{font-size:24px}

/* secciones del editor */
details.grp{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
details.grp>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:15px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .n{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.06em}
details.grp>summary .hint{margin-left:auto;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
details.grp>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:6px;transition:transform .15s}
details.grp[open]>summary::after{transform:rotate(-135deg)}
.gb{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:11.5px;color:var(--muted);font-weight:600}
.fld input,.fld select,.li input{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-variant-numeric:tabular-nums}
.fld input:focus,.li input:focus{border-color:var(--accent);outline:none}
.sub{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:grid;grid-template-columns:minmax(0,1fr) 130px 28px;gap:6px;align-items:center}
.li.one{grid-template-columns:minmax(0,1fr) 28px}
.li.hrs{grid-template-columns:minmax(0,1fr) 80px 28px}
.li.esc{grid-template-columns:1fr 1fr 28px}
.x{width:28px;height:28px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.x:hover{color:var(--accent);border-color:var(--line)}
.note{font-size:12px;color:var(--muted)}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--field)}
.opt-h{display:flex;align-items:center;gap:8px}
.opt-h b{font-family:var(--display);font-size:13px;color:var(--accent)}
.opt-h em{font-style:normal;font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .row3,.opt .row{gap:6px}
.opt .fld input{background:var(--panel)}
.opt-t{font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}

/* hojas */
.sheets{display:flex;flex-direction:column;align-items:center;gap:22px}
.sheetwrap{position:relative;flex:none;box-shadow:0 1px 2px rgba(20,10,20,.12),0 10px 30px -12px rgba(20,10,20,.35);border-radius:2px;overflow:hidden;background:#fff}
.sheetwrap>.pg{transform-origin:0 0;position:absolute;left:0;top:0}
.pvlabel{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:-14px;font-variant-numeric:tabular-nums}
#render{position:absolute;left:-30000px;top:0;width:816px;pointer-events:none}

/* cajón de guardados */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:20;
  box-shadow:-20px 0 40px -20px rgba(0,0,0,.35);display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.drawer h3{font-family:var(--display);font-size:18px;margin:0}
.dr-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dr-h h3{flex:1}
.dr-l{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.sv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.sv b{font-family:var(--display);font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.sv .a{grid-row:1/3;grid-column:2;display:flex;gap:6px}
.sv.cur{border-color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,5,12,.35);z-index:19}
.empty{color:var(--muted);font-size:13px;padding:18px 4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.busy{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:600}
.bar{width:220px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0;transition:width .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* =================== DOCUMENTO =================== */
.pg{width:816px;height:1056px;background:var(--d-paper);color:var(--d-ink);font-family:var(--body);font-size:12.6px;line-height:1.5;
  display:flex;flex-direction:column;position:relative;overflow:hidden}
.pg *{box-sizing:border-box}
.pg-bar{height:5px;background:linear-gradient(90deg,var(--d-org),var(--d-mag) 60%,#B81A73)}
.pg-hd{height:62px;display:flex;align-items:center;gap:12px;padding:0 56px;border-bottom:1px solid var(--d-line)}
.pg-hd .lg{display:flex;align-items:center;gap:12px}
.pg-hd .lg img.m{height:24px;width:auto}
.pg-hd .lg i{width:1px;height:22px;background:var(--d-line)}
.pg-hd .lg img.u{height:26px;width:auto}
.pg-hd .r{margin-left:auto;text-align:right;font-size:10.5px;color:var(--d-faint);line-height:1.3}
.pg-hd .r b{display:block;color:var(--d-ink);font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.02em}
.pg-body{flex:1;min-height:0;padding:26px 56px 14px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.pg-body>*{flex-shrink:0}
.pg-ft{height:44px;display:flex;align-items:center;padding:0 56px;font-size:10px;color:var(--d-faint);border-top:1px solid var(--d-line);gap:10px}
.pg-ft .pn{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--d-soft);font-weight:600}
.pg-ft .dot{width:4px;height:4px;border-radius:50%;background:var(--d-mag)}

.pg h2{font-family:var(--display);font-size:24px;line-height:1.15;font-weight:700;margin:0;letter-spacing:-.015em;color:var(--d-ink)}
.pg h3{font-family:var(--display);font-size:14.5px;font-weight:600;margin:0;color:var(--d-ink)}
.pg p{margin:0}
.pg b,.pg strong{font-weight:700}
.eb{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--d-mag);margin-bottom:6px}
.eb .num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;padding:0 6px;border-radius:5px;background:var(--d-mag);color:#fff;letter-spacing:.02em;font-size:10.5px}
.lead{color:var(--d-soft);font-size:13.2px;margin-top:6px !important;max-width:620px}
.blk{display:flex;flex-direction:column;gap:10px}
.ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ul>li{position:relative;padding-left:16px}
.ul>li::before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:2px;background:var(--d-org)}
.ul .ul>li::before{background:transparent;border:1.5px solid var(--d-mag);border-radius:50%;width:6px;height:6px}
.ul .ul{margin-top:6px}
.lbl{font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--d-faint)}
.box{border:1px solid var(--d-line);border-radius:12px;padding:14px 16px}
.mist{background:var(--d-mist);border-color:var(--d-mist)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.num-t{font-variant-numeric:tabular-nums}

/* portada */
.cover{background:var(--d-plum);color:#fff}
.cv-glow1{position:absolute;width:760px;height:760px;right:-300px;top:-260px;border-radius:50%;background:radial-gradient(circle,rgba(226,36,111,.55),rgba(226,36,111,0) 68%)}
.cv-glow2{position:absolute;width:700px;height:700px;left:-320px;bottom:-300px;border-radius:50%;background:radial-gradient(circle,rgba(240,123,55,.45),rgba(240,123,55,0) 68%)}
.cv-pill{position:absolute;border:2px solid rgba(240,123,55,.75);border-radius:999px}
.cv-dots{position:absolute;display:grid;grid-template-columns:repeat(4,8px);gap:16px}
.cv-dots i{width:5px;height:5px;border-radius:50%;background:var(--d-mag)}
.cv-in{position:relative;flex:1;display:flex;flex-direction:column;padding:64px 72px 56px}
.cv-top{display:flex;align-items:center;justify-content:space-between}
.cv-top img{height:46px;width:auto}
.cv-top span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6);font-family:var(--display)}
.cv-logo{margin-top:120px;width:400px}
.cv-logo img{width:100%;height:auto;display:block}
.cv-ttl{margin-top:auto}
.cv-ttl .k{font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--d-org);font-weight:600}
.cv-ttl h1{font-family:var(--display);font-size:52px;line-height:1.02;font-weight:700;margin:12px 0 0;letter-spacing:-.025em;color:#fff;max-width:640px}
.cv-meta{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:44px;margin-top:34px;padding-top:22px;border-top:1px solid rgba(255,255,255,.18)}
.cv-meta span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);font-family:var(--display)}
.cv-meta b{font-family:var(--display);font-size:17px;font-weight:600;color:#fff}
.cv-ft{display:flex;justify-content:space-between;align-items:center;margin-top:46px;font-size:11px;color:rgba(255,255,255,.55)}
.cv-ft b{color:#fff;font-family:var(--display);font-size:15px;font-weight:600}
.cv-ft b em{font-style:normal;color:var(--d-mag)}

/* bloques */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.idc h1{font-family:var(--display);font-size:34px;line-height:1.05;margin:4px 0 0;font-weight:700;letter-spacing:-.02em}
.idm{display:flex;gap:26px;margin-top:14px}
.idm span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--d-faint);font-family:var(--display);font-weight:600}
.idm b{font-family:var(--display);font-size:14px;font-weight:600}
.conf{font-size:10.8px;color:var(--d-soft);line-height:1.45}
.conf b{display:block;font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:10px;color:var(--d-ink);margin-bottom:4px}
.kpis{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;border:1px solid var(--d-line);border-radius:14px;overflow:hidden}
.kpis>div{padding:14px 16px;border-left:1px solid var(--d-line)}
.kpis>div:first-child{border-left:0;background:linear-gradient(125deg,var(--d-org),var(--d-mag));color:#fff}
.kpis span{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-family:var(--display);font-weight:600;color:var(--d-faint)}
.kpis>div:first-child span{color:rgba(255,255,255,.8)}
.kpis b{display:block;font-family:var(--display);font-size:17px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis>div:first-child b{font-size:21px}
.kpis small{display:block;font-size:10.5px;color:var(--d-faint);margin-top:2px}
.kpis>div:first-child small{color:rgba(255,255,255,.8)}
.feat{border-radius:12px;padding:14px 15px;background:var(--d-mist)}
.feat .ic{width:30px;height:30px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.feat .ic svg{width:17px;height:17px}
.feat h3{font-size:13.5px;margin-bottom:3px}
.feat p{font-size:11.6px;color:var(--d-soft);line-height:1.45}
.mods{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
.mcard{border:1px solid var(--d-line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mcard .hd{display:flex;align-items:baseline;gap:8px}
.mcard .hd small{margin-left:auto;font-size:10.5px;color:var(--d-faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--d-mist);font-size:11.6px;font-weight:500;line-height:1.2}
.chip i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--d-org),var(--d-mag));display:inline-flex;align-items:center;justify-content:center}
.chip i svg{width:8px;height:8px}
.chip.alt{background:#fff;border:1px solid var(--d-line)}
.na{font-size:11.6px;color:var(--d-faint)}
.track{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--d-line)}
.track>div{flex:1;padding:12px 14px;position:relative;border-left:1px solid var(--d-line);min-width:0}
.track>div:first-child{border-left:0}
.track .st{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--d-faint);font-family:var(--display);font-weight:600}
.track h3{font-size:13.5px;margin-top:2px}
.track .h{font-family:var(--display);font-size:22px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.track .h small{font-size:12px;font-weight:500;color:var(--d-soft);margin-left:2px}
.track .fill{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--d-org),var(--d-mag))}
.call{display:flex;align-items:center;gap:14px;border-radius:12px;padding:12px 16px;background:var(--d-plum);color:#fff}
.call b{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
.call span{font-size:12px;color:rgba(255,255,255,.75)}
.spec{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--d-line);border-radius:12px;overflow:hidden}
.spec>div{padding:12px 12px;border-left:1px solid var(--d-line)}
.spec>div:first-child{border-left:0}
.spec b{display:block;font-family:var(--display);font-size:18px;font-weight:700;line-height:1.1}

.ben{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ben>div{padding:12px 14px;border-radius:12px;background:var(--d-mist)}
.ben h3{font-size:13px;margin-bottom:2px}
.ben p{font-size:11.5px;color:var(--d-soft)}
.svc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.svc>div{border:1px solid var(--d-line);border-radius:10px;padding:10px 12px}
.svc b{display:block;font-family:var(--display);font-size:12.8px;font-weight:600}
.svc span{font-size:11px;color:var(--d-soft);line-height:1.4;display:block;margin-top:2px}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:12px}

table.t td{padding:7px 12px;border-bottom:1px solid var(--d-line)}
table.t .r{text-align:right}
table.t .c{text-align:center}
table.t tr.st-row td{font-weight:700;background:var(--d-mist);border-bottom:0}

table.t.cmp td{padding:4px 10px;font-size:11.2px}

.inv{display:grid;grid-template-columns:1fr 1fr;border-radius:16px;overflow:hidden;background:var(--d-plum);color:#fff;position:relative}
.inv .l{padding:20px 22px;position:relative}
.inv .l span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--display);color:rgba(255,255,255,.65);font-weight:600}
.inv .l b{display:block;font-family:var(--display);font-size:36px;font-weight:700;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.inv .l small{display:block;font-size:11px;color:rgba(255,255,255,.65);margin-top:2px}

.inv .rr div b{font-family:var(--display);font-size:15px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.inv .glow{position:absolute;width:420px;height:420px;border-radius:50%;left:-120px;top:-220px;background:radial-gradient(circle,rgba(226,36,111,.55),rgba(226,36,111,0) 70%)}
.fine{font-size:11.2px;color:var(--d-soft)}

.abc .sep{height:1px;background:rgba(255,255,255,.3)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:12px}

.cond h3{display:flex;align-items:center;gap:8px}

const nf = new Intl.NumberFormat("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat("es-AR",{maximumFractionDigits:2});
const $m = v => "$ " + nf.format(Math.round((+v||0)*100)/100);
const $s = v => "$ " + nf0.format(Math.round(+v||0));
const n0 = v => nf0.format(+v||0);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pd = s => { const [y,m,d] = (s||"").split("-").map(Number); return y ? new Date(Date.UTC(y,m-1,d)) : null; };
const fd = dt => dt ? String(dt.getUTCDate()).padStart(2,"0")+"/"+String(dt.getUTCMonth()+1).padStart(2,"0")+"/"+dt.getUTCFullYear() : "—";
const fds = s => fd(pd(s));
const addM = (dt,k) => { const y = dt.getUTCFullYear(), m = dt.getUTCMonth()+k, d = dt.getUTCDate(); const last = new Date(Date.UTC(y,m+1,0)).getUTCDate(); return new Date(Date.UTC(y,m,Math.min(d,last))); };
const days = (a,b) => Math.round((b-a)/86400000);
const r2 = v => Math.round(v*100)/100;

function calc(){
  const prodMods = S.modulos.reduce((a,m)=>a+(+m.precio||0),0);
  const prodInt = S.integraciones.reduce((a,m)=>a+(+m.precio||0),0);
  const subMod = (+S.backOffice.precio||0) + prodMods;
  const prod = subMod + prodInt;
  const horas = S.etapas.reduce((a,e)=>a+(+e.horas||0),0);
  const horasM = S.etapas.reduce((a,e)=>a+(+e.horas||0)*(+S.valorHora||0),0);
  const total = prod + horasM;
  const opciones = S.opciones.map(o => planOf(o, total, prod));
  return {prodMods, prodInt, subMod, prod, horas, horasM, total, opciones, abonoMin:(+S.abono||0)*(+S.minSesiones||0)};
}
function titleOf(o){
  if (o.titulo && o.titulo.trim()) return o.titulo.trim() + (+o.cuotas>0 ? "" : (+o.desc>0 ? ` (${n0(o.desc)}% de descuento)` : ""));
  const p = [];
  if (+o.cuotas <= 0) return "Pago contado" + (+o.desc>0 ? ` (${n0(o.desc)}% de descuento)` : "");
  if (+o.desc>0) p.push(`${n0(o.desc)}% de descuento`);
  if (+o.ant>0) p.push(`${n0(o.ant)}% de anticipo`);
  p.push(`${n0(o.cuotas)} cuotas ${+o.int>0 ? `con ${n0(o.int)}% de interés` : "sin interés"}`);
  return p.join(" + ");
}
function planOf(o, total, prod){
  const desc = Math.max(0, +o.desc||0), n = Math.max(0, Math.floor(+o.cuotas||0));
  const descM = r2(prod*desc/100);
  const conDto = r2(total - descM);
  const start = pd(S.fechaPago) || new Date();
  const rows = [];
  if (n === 0){
    rows.push({fecha:start, concepto:"Contado", dias:"100%", monto:conDto});
    return {titulo:titleOf(o), sin:total, descM, conDto, anticipo:conDto, n, cuota:0, interes:0, final:conDto, rows};
  }
  const ant = Math.min(100, Math.max(0, +o.ant||0));
  const anticipo = r2(conDto*ant/100);
  const fin = conDto - anticipo;
  const interes = r2(fin*(Math.max(0,+o.int||0))/100);
  const cuota = r2((fin+interes)/n);
  if (anticipo>0) rows.push({fecha:start, concepto:"Anticipo", dias:n0(ant)+"%", monto:anticipo});
  let acc = 0;
  for (let i=1;i<=n;i++){
    const f = addM(start,i);
    const m = i<n ? cuota : r2(fin+interes-acc);
    acc = r2(acc+m);
    rows.push({fecha:f, concepto:"Cuota "+i, dias:String(days(start,f)), monto:m});
  }
  return {titulo:titleOf(o), sin:total, descM, conDto, anticipo, n, cuota, interes, final:r2(conDto+interes), rows};
}

const host = document.getElementById("render");
function paginate(){
  const c = calc();
  host.innerHTML = coverHTML(c);
  let page = null, body = null;
  const np = () => { page = pageShell(); host.appendChild(page); body = page.querySelector(".pg-body"); };
  np();
  for (const b of blocks(c)){
    if (b.brk && body.children.length) np();
    const w = document.createElement("div"); w.innerHTML = b.html.trim();
    const el = w.firstElementChild;
    body.appendChild(el);
    if (body.scrollHeight > body.clientHeight + 1 && body.children.length > 1){
      body.removeChild(el); np(); body.appendChild(el);
    }
  }
  const pages = host.querySelectorAll(".pg");
  pages.forEach((p,i)=>{ const pn = p.querySelector(".pn"); if (pn) pn.textContent = `Página ${i+1} de ${pages.length}`; });
  return pages.length;
}

function toast(msg){
  const h = document.getElementById("toastHost"); h.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;

/* ---------------- PDF ---------------- */
const fname = () => `${(S.cliente||"Cliente").replace(/[\\/:*?"<>|]/g,"").trim()} - Presupuesto Implementación Advance ERP V${S.version||"1.0"}.pdf`;
async function buildPdf(onProg){
  await document.fonts.ready;
  paginate();
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:"pt", format:[612,792], compress:true });
  const pages = [...host.querySelectorAll(".pg")];
  host.style.left = "0px"; host.style.zIndex = "-1";
  try {
    for (let i=0;i<pages.length;i++){
      const cv = await html2canvas(pages[i], { scale:2, backgroundColor:"#ffffff", useCORS:true, logging:false, width:W, height:H, scrollX:0, scrollY:-window.scrollY, windowWidth:1280 });
      if (i>0) pdf.addPage([612,792]);
      pdf.addImage(cv.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, 612, 792, undefined, "FAST");
      onProg && onProg((i+1)/pages.length);
    }
  } finally { host.style.left = "-30000px"; host.style.zIndex = ""; }
  return pdf.output("blob");
}
window.__buildPdf = buildPdf;
let downloads = null;
document.getElementById("bPdf").addEventListener("click", async () => {
  const b = document.getElementById("bPdf");
  if (!downloads && window.claude){ toast("La descarga no está disponible en esta vista."); return; }
  b.disabled = true;
  const busy = document.createElement("div"); busy.className = "busy"; busy.innerHTML = `<span>Generando PDF…</span><div class="bar"><i></i></div>`; document.body.appendChild(busy);
  try {
    const blob = await buildPdf(p => { busy.querySelector("i").style.width = Math.round(p*100)+"%"; });
    busy.remove();
    if (downloads) await downloads.save({ filename: fname(), data: blob });
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000); }
    toast("PDF descargado");
  } catch(e){
    busy.remove();
    if (e && e.code==="declined") toast("Descarga cancelada");
    else if (e && e.code==="rate_limited") toast("Ya hay una descarga esperando confirmación");
    else toast("No se pudo generar el PDF. Probá de nuevo en unos segundos.");
  } finally { b.disabled = false; }
});

async function save(){
  if (!db){ toast("Guardar no está disponible en esta vista. El borrador queda en este navegador."); return; }
  const c = calc();
  const doc = { cliente:S.cliente||"Sin cliente", version:S.version||"", fecha:S.fecha||"", total:c.total, updatedAt:Date.now(), data:clone(S) };
  try {
    if (savedId) await db.collection("presupuestos").doc(savedId).set(doc);
    else { const ref = await db.collection("presupuestos").add(doc); savedId = ref.id; }
    try { localStorage.setItem("advPres.draft", JSON.stringify({S, id:savedId})); } catch(e){}
    toast(`Guardado: ${doc.cliente} V${doc.version}`);
    if (drawerOpen) renderDrawer();
  } catch(e){
    toast(e && e.code==="quota_exceeded" ? "No hay más espacio para guardar. Eliminá presupuestos viejos." : "No se pudo guardar. Revisá tu conexión y probá de nuevo.");
  }
}

}
document.getElementById("drawerHost").addEventListener("click", async e => {
  const t = e.target.closest("button,[data-close]"); if (!t) return;

  if (t.dataset.new){ S = clone(TEMPLATE); S.cliente = ""; savedId = null; renderEditor(); changed(); drawerOpen=false; renderDrawer(); toast("Nuevo presupuesto desde la plantilla"); return; }
  if (t.dataset.copy){ savedId = null; S.version = S.version; await save(); return; }
  if (t.dataset.open){ const s = saved.find(x=>x.id===t.dataset.open); if (s){ S = Object.assign(clone(TEMPLATE), clone(s.data)); savedId = s.id; renderEditor(); changed(); drawerOpen=false; renderDrawer(); toast(`Abierto: ${s.cliente}`); } return; }
  if (t.dataset.del){
    if (delArm !== t.dataset.del){ delArm = t.dataset.del; renderDrawer(); return; }
    try { await db.collection("presupuestos").doc(t.dataset.del).delete(); if (savedId===t.dataset.del) savedId=null; toast("Presupuesto eliminado"); } catch(_){ toast("No se pudo eliminar"); }
    delArm = null; renderDrawer();
  }
});

/* Fuera de claude.ai: guarda los presupuestos en este navegador */
function localDb(){
  const K = "advPres.saved"; const subs = [];
  const read = () => { try { return JSON.parse(localStorage.getItem(K)||"{}"); } catch(e){ return {}; } };
  const write = o => { localStorage.setItem(K, JSON.stringify(o)); emit(); };
  const snap = () => { const o = read(); const docs = Object.keys(o).map(id=>({id, data:()=>o[id]})).sort((a,b)=>(b.data().updatedAt||0)-(a.data().updatedAt||0)); return {docs}; };
  const emit = () => subs.forEach(f => f(snap()));
  const coll = {
    doc: id => ({ id, set: async d => { const o = read(); o[id] = d; write(o); }, delete: async () => { const o = read(); delete o[id]; write(o); } }),
    add: async d => { const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); const o = read(); o[id] = d; write(o); return {id}; },
    orderBy(){ return coll; }, limit(){ return coll; },
    onSnapshot(f){ subs.push(f); setTimeout(()=>f(snap()),0); return ()=>{}; }
  };
  return { collection: () => coll };
}
if (!(window.claude && window.claude.use)){
  db = localDb();
  db.collection("presupuestos").onSnapshot(snap => { saved = snap.docs.map(x => Object.assign({id:x.id}, x.data())); refreshDatalist(); if (drawerOpen) renderDrawer(); });
}
if (window.claude && window.claude.use){
  window.claude.use("downloads").then(d => { downloads = d; if (!d) document.getElementById("bPdf").title = "Descarga no disponible en esta vista"; });
  window.claude.use("db").then(d => {
    db = d; if (!d) return;
    db.collection("presupuestos").orderBy("updatedAt","desc").limit(300).onSnapshot(snap => {
      saved = snap.docs.map(x => Object.assign({id:x.id}, x.data()));
      refreshDatalist(); if (drawerOpen) renderDrawer();
    }, () => {});
  });
}
